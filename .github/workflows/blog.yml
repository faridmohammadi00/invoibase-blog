name: Blog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: blog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Install
        run: node .yarn/releases/yarn-3.6.1.cjs install --immutable
      - name: Lint
        run: node .yarn/releases/yarn-3.6.1.cjs lint:ci
      - name: Build
        run: node .yarn/releases/yarn-3.6.1.cjs build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: invoibase-blog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "Set repository secrets DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY must be the private key, including BEGIN/END lines"
            exit 1
          fi
          PORT="${SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes "${SSH_USER}@${SSH_HOST}" bash -s <<'EOS'
          set -euo pipefail
          cd /home/deploy/invoibase-blog
          git fetch --all --prune
          git checkout main
          git pull --ff-only origin main
          SKIP_GIT_PULL=1 bash scripts/deploy.sh
          EOS
